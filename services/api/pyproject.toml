[project]
name = "mining-governance-api"
version = "0.1.0"
description = "FastAPI backend for the AI-based Smart Mining Governance & Compliance System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.20",
    "pgvector>=0.3.6",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    # Supabase Auth issues JWTs; verification needs PyJWT. The ``crypto`` extra
    # brings in ``cryptography`` for the ES256/RS256 keys that new Supabase
    # projects sign with.
    "pyjwt[crypto]>=2.10",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:geoalchemy2.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
